[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "classy-community"
# Single source of truth for the version. CMakeLists.txt derives the C++
# _VERSION_ macro from this line, so the wheel metadata and the binary can't drift.
version = "26.0.0"
authors = [
  { name="Thomas Tram", email="thomas.tram@phys.au.dk"},
]
description = "Python interface to the C++ community-edition of the cosmological Boltzmann code CLASS"
readme = "README.md"
requires-python = ">=3.10"
# classy returns numpy arrays, so import fails without numpy. The floor dates from the Cython core,
# whose wheels needed NumPy's 1.25 C-API; the nanobind core needs no NumPy to build, and nothing
# older than 1.25 is tested.
dependencies = ["numpy>=1.25"]
license-files = ["COPYING.txt", "LICENSE.txt", "AUTHORS.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/AarhusCosmology/CLASSpp_public"
"Bug Tracker" = "https://github.com/AarhusCosmology/CLASSpp_public/issues"

# What the tests in python/ import besides classy. Not part of the package: CI
# installs it with `pip install --group test` (pip >= 25.1) into a venv that sees
# none of the runner's packages, so a missing entry here fails CI.
[dependency-groups]
test = ["pytest", "parameterized", "numpy", "scipy", "matplotlib"]

[tool.scikit-build]
# 3.26: FindPython's Development.SABIModule, for the stable-ABI build below.
cmake.version = ">=3.26"
# On CPython 3.12 and later, one stable-ABI (abi3) wheel serves every later version; on 3.10 and
# 3.11 the wheel is built for that version alone. No measurable cost per call (2026-11-23).
wheel.py-api = "cp312"
wheel.packages = []
# sdist: scikit-build-core includes the source tree minus .gitignore matches.
# Exclude local clutter that is not gitignored; everything the build needs
# (sources, headers, src/classy/, bbn/hyrec data,
# CMakeLists.txt) is included by default. /scripts stays in: the sdist ships
# the Makefile, whose classy target calls scripts/montepython_layout.py.
sdist.exclude = [
  "/doc",
  "/docs",
  "/notebooks",
  "/test",
  "/python",
  "/.claude",
  "/.github/copilot-instructions.md",
  "/new-build-system-kickoff.md",
  "/test-greybody-moments",
  "/test-photons",
  "/CPU",
  "*.dSYM",
  "*.ipynb",
]
