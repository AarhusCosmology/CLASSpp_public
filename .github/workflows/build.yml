name: Build on Linux

on: [push]

permissions:
  contents: read

# A newer push to a branch cancels the run still going on it; on master every
# commit runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: [self-hosted, linux, light]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
    - name: cmake version
      run: cmake --version
    - name: make
      run: cd main_class && make class
    - name: run class
      run: cd main_class && ./class explanatory.ini
    - name: unit tests
      run: cd main_class && make test

  test_classy:
    runs-on:
      group: private
      labels: [self-hosted, light]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          path: main_class
      # No numpy preinstall: `pip install .` must pull it in from the declared
      # dependency, so this fails if that declaration is ever lost.
      - name: Run test 🤖
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}"/main_class:/github \
            python:latest bash -c '
              python -m venv /tmp/venv &&
              source /tmp/venv/bin/activate &&
              cd /github &&
              pip install . &&
              python -c "import classy"
            '


  nose_tests_lvl1:
    runs-on: [self-hosted, linux, heavy]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
    # The runner empties RUNNER_TEMP at the start and end of every job, so the venv
    # lives and dies with the job. Its bin/ goes first on PATH for the later steps.
    # It sees none of the runner's own packages: the tests get pyproject.toml's test
    # group and what classy pulls in, so an undeclared dependency fails here.
    - name: Create virtual Python environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && pip install .
    - name: Testing 🤖
      run: |
        cd main_class/python
        TEST_LEVEL=1 COMPARE_OUTPUT_REF=0 python -m pytest -v -m test_scenario test_class.py
        # The regression tests PRs add to test_class.py carry no test_scenario
        # marker, so the selection above never ran a single one of them. That is
        # how the l_max_dr_col default broke: test_dncdm_dr_computes was sitting
        # in the file, failing, unread. The classyref-comparison tests among them
        # skip themselves when classyref is not installed, which it is not here.
        python -m pytest -v -m "not test_scenario" test_class.py
        python -m pytest -v test_greybody.py test_hyperspherical.py test_transfer_totals.py
        # Cobaya's own classy theory driving this wrapper. REQUIRE makes a
        # missing Cobaya fail here instead of skipping the module green.
        pip install cobaya
        CLASSPP_REQUIRE_COBAYA=1 python -m pytest -v test_cobaya.py
