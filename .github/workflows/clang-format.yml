name: clang-format

on: [pull_request]

permissions:
  contents: read

# A new push to the pull request cancels the run on the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: [self-hosted, linux, heavy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for diff against base branch

      # The files this pull request adds or changes, hyrec/ excepted. The shas reach the
      # script through env and the file names through xargs -0, so a file name is never
      # parsed by the shell. Every file is checked, and any badly formatted one fails.
      - name: Run clang-format check on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          clang-format-22 --version
          git diff -z --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" -- \
              '*.cpp' '*.c' '*.h' '*.hpp' ':!hyrec/' \
            | xargs -0 -r -t clang-format-22 --dry-run --Werror
