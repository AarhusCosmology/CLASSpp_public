name: Documentation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels the run on the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doxygen:
    runs-on: [self-hosted, linux, light]

    steps:
      - uses: actions/checkout@v7

      - name: Check documentation dependencies
        run: |
          doxygen --version
          dot -V

      - name: Clean generated documentation
        run: |
          rm -rf doc/manual/html
          rm -rf doc/manual/latex

      - name: Build documentation
        run: cd doc/input && doxygen doxyconf

  site:
    runs-on: [self-hosted, linux, light]

    steps:
      - uses: actions/checkout@v7

      # Lives in RUNNER_TEMP, which the runner empties after the job; see build.yml.
      - name: Create virtual Python environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r doc/site/requirements.txt

      - name: Build site (no notebook execution)
        run: |
          rm -rf doc/site/_build
          python -m sphinx -W --keep-going -b html doc/site doc/site/_build/html
