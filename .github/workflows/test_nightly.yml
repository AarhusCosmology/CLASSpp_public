name: Nosetests and Valgrind

on:
  schedule:
    - cron: '0 17 * * *'  # Daily at UTC 17:00

permissions:
  contents: read

jobs:
  # The public repository's master is the last commit that passed this workflow, since
  # conclude pushes exactly that commit. If master has not moved since, nothing runs.
  # Failing to read it leaves last_tested empty, and then everything runs.
  iftest:
    runs-on: [self-hosted, linux]
    outputs:
      should_run: ${{ steps.store_output.outputs.SHOULD_RUN }}
    steps:
    - name: Store output
      id: store_output
      run: |
        last_tested=$(git ls-remote https://github.com/AarhusCosmology/CLASSpp_public refs/heads/master | cut -f1)
        echo "Last tested: ${last_tested:-unknown}, master: $GITHUB_SHA"
        if [ "$last_tested" != "$GITHUB_SHA" ]; then
          echo "SHOULD_RUN=1" >> "$GITHUB_OUTPUT"
        fi

  conclude:
    runs-on: [self-hosted, linux]
    needs: [nose_tests_lvl3, valgrind-wide-and-shallow, valgrind-narrow-and-deep]
    steps:
    # The commit the tests ran on, not master as it is now: a merge during a long
    # Valgrind run must not reach the public repository untested.
    - name: Checkout tested commit 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
        ref: ${{ github.sha }}
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
    - name: Push to public master
      env:
        TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      run: |
        cd main_class
        git push https://AarhusCosmology:"$TOKEN"@github.com/AarhusCosmology/CLASSpp_public "$GITHUB_SHA":refs/heads/master

  deploy_documentation:
    name: Deploy documentation
    runs-on: [self-hosted, linux, light]
    needs: conclude
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Doxygen HTML
        run: cd doc/input && doxygen doxyconf

      # Lives in RUNNER_TEMP, which the runner empties after the job; see build.yml.
      - name: Create virtual Python environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install .
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r doc/site/requirements.txt

      - name: Build site with executed notebooks
        run: |
          rm -rf doc/site/_build
          CLASSPP_DOCS_EXECUTE=force python -m sphinx -b html doc/site doc/site/_build/html

      - name: Add C++ API reference
        run: cp -r doc/manual/html doc/site/_build/html/api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/site/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  nose_tests_lvl3:
    runs-on: [self-hosted, linux, heavy]
    needs: iftest
    if: needs.iftest.outputs.should_run
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
    # Lives in RUNNER_TEMP, which the runner empties after the job; see build.yml.
    - name: Create virtual Python environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && pip install .
    - name: Testing 🤖
      run: |
        cd main_class/python
        COMPARE_OUTPUT_GAUGE=1 TEST_LEVEL=3 python -m pytest -v -m test_scenario test_class.py
    - name: Upload plots 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ComparePlots
        path: main_class/python/faulty_figs
        if-no-files-found: ignore

  valgrind-wide-and-shallow:
    runs-on: [self-hosted, linux, heavy, private]
    needs: iftest
    if: needs.iftest.outputs.should_run
    timeout-minutes: 1440
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
    # Lives in RUNNER_TEMP, which the runner empties after the job; see build.yml.
    - name: Create virtual Python environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && make class -j && pip install .
    - name: Generate input files
      run: |
        cd main_class/python
        TEST_LEVEL=3 CLASS_VERBOSE=1 python -m pytest -m dump_ini_files test_class.py
    - name: Valgrind 🤖
      run: |
        cd main_class/python/faulty_figs
        rm -rf output && mkdir output
        rm -rf valgrind_output && mkdir valgrind_output
        cp ../../class .
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 6 bash -c ': \
          && printf "\nk_step_sub = 10.0\nk_step_super = 0.4\nk_per_decade_for_pk = 2\nk_per_decade_for_bao = 5\n" >> {}'
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 6 bash -c ': \
          && (valgrind --leak-check=full --error-exitcode=3 ./class {} &> {}.out && echo {} "...ok") \
          || (echo {} "...fail" && cp {}* valgrind_output && exit 3)'
    - name: Upload errors 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ValgrindOutputWideShallow
        path: main_class/python/faulty_figs/valgrind_output
        if-no-files-found: ignore

  valgrind-narrow-and-deep:
    runs-on: [self-hosted, linux, heavy, private]
    needs: iftest
    if: needs.iftest.outputs.should_run
    timeout-minutes: 1440
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7
      with:
        path: main_class
    # Lives in RUNNER_TEMP, which the runner empties after the job; see build.yml.
    - name: Create virtual Python environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && make class -j && pip install .
    - name: Generate input files
      run: |
        cd main_class/python
        TEST_LEVEL=1 CLASS_VERBOSE=1 python -m pytest -m dump_ini_files test_class.py
    - name: Valgrind 🤖
      run: |
        cd main_class/python/faulty_figs
        rm -rf output && mkdir output
        rm -rf valgrind_output && mkdir valgrind_output
        cp ../../class .
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 6 bash -c ': \
          && (valgrind --leak-check=full --error-exitcode=3 ./class {} &> {}.out && echo {} "...ok") \
          || (echo {} "...fail" && cp {}* valgrind_output && exit 3)'
    - name: Upload errors 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ValgrindOutputNarrowDeep
        path: main_class/python/faulty_figs/valgrind_output
        if-no-files-found: ignore
