# Grey-body NCDM example (dot-syntax, direct parameterization).
#
# A grey-body species has phase-space distribution
#   f0(q) ∝ q^(alpha-1) / ( exp(alpha*x*q) + 1 ),
# a generalization of Fermi-Dirac (recovered as alpha -> 1). It is selected
# with `<name>.type = ncdm_greybody` and supports two input modes via
# `<name>.parameterization`:
#
#   direct  — give the shape parameters explicitly:
#               <name>.alpha   shape exponent (> 0)
#               <name>.q0      momentum scale (> 0)
#               <name>.x       inverse-temperature parameter (> 0)
#
#   moments — give dimensionless moment ratios and the solver inverts for
#             (alpha, x, q0):
#               <name>.r       M2*M4/M3^2
#               <name>.M2      second moment
#               <name>.M3      third moment
#             plus an optional mass convenience:
#               <name>.m_M2    sets m = m_M2 / M2 (inferred mass must be
#                              >= 0.01 eV; the moment inversion is unreliable
#                              in the low-mass limit and is rejected below it)
#
# Mass is supplied with the standard NCDM `<name>.m` (eV); the quadrature
# defaults to the grey-body-tuned generalized Gauss-Laguerre rule, so
# momenta_bins / quadrature_strategy / max_q normally need not be set.
#
# This file uses the direct mode; see test/scenarios/ncdm_greybody.ini for a
# moments-mode example.

output = mPk
P_k_max_1/Mpc = 1.0
h = 0.67556
omega_b = 0.022032
omega_cdm = 0.12038
N_ur = 2.0308

gb.type = ncdm_greybody
gb.parameterization = direct
gb.alpha = 2.5
gb.q0 = 1.3
gb.x = 0.8
gb.m = 0.1

root = output/dotsyntax_greybody_
