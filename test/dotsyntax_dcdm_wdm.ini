# DCDM -> two massive decay products (arXiv:2606.14849), dot-syntax example.
# f = Omega_ini_ddm / (Omega_ini_ddm + Omega_cdm) is the unstable DM fraction.
h = 0.6736
omega_b = 0.02237
Omega_cdm = 0.234
ddm.type = dcdm_wdm
ddm.Gamma = 97.78       # km/s/Mpc; Gamma[km/s/Mpc] = 977.79 / Gamma^-1[Gyr], so this is 10 Gyr
ddm.vkick = 0.02        # kick velocity in units of c; alternative: ddm.epsilon
ddm.Omega_ini = 0.026   # parent initial abundance (dcdm convention)
ddm.momenta_bins = 96
output = tCl,pCl,lCl,mPk
lensing = yes
gauge = synchronous
# The daughter hierarchy (~1700 extra equations per mode) is not stiff: the
# Dormand-Prince RK45 evolver is ~14x faster than the default ndf15 here and
# agrees to ~3e-5 on all observables (see notebooks/dcdm-wdm-massive-decay-products.ipynb).
evolver = 2
