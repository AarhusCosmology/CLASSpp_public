# 100*theta_s together with a massive neutrino.
#
# Regression for the legacy-NCDM transmutation not being idempotent: every
# shooting target reparses the FileContent, and the second pass used to abort on
# the ncdm__1.* keys the first pass had written. thetas.ini covers 100*theta_s
# but has no NCDM, which is why CI missed it.
output = tCl,pCl,mPk
l_max_scalars = 1000
P_k_max_1/Mpc = 1.0
100*theta_s = 1.041783
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06
root = test/scenarios/redesign/out/thetas_ncdm_
