# Background-only smoke combining NCDM + DNCDM_DR + IDM_DR_IDR.
# Exercises species construction/registration ordering across all three types.
# Perturbation correctness for NCDM is exercised by the dedicated NCDM
# scenarios; DNCDM_DR perturbation correctness is exercised by the pytest
# scenario suite in Task 19.
h = 0.67556
T_cmb = 2.7255
omega_b = 0.022032
N_ur = 2.0
omega_cdm = 0.10
YHe = BBN
recombination = RECFAST
output =
input_verbose = 1
background_verbose = 1
write background = yes

# Standard NCDM
nu1.type = ncdm_standard
nu1.m = 0.06
nu1.T = 0.71611
nu1.deg = 1.0
nu1.quadrature_strategy = 2
nu1.momenta_bins = 7
nu1.max_q = 18.0

# DNCDM_DR composite (decaying NCDM with daughter DR)
dncdm1.type = ncdm_decay_dr
dncdm1.m = 1.0
dncdm1.T = 0.71611
dncdm1.Gamma = 1e3
dncdm1.Omega = 0.001

# IDM_DR + IDR
Omega_idm_dr = 0.01
xi_idr = 0.5
stat_f_idr = 0.875
a_idm_dr = 1e3

root = output/scen_combined_
