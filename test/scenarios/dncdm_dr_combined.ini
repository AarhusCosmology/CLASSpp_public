# DNCDM_DR closure smoke (combined-today normalization). Background-only.
T_cmb = 2.7255
omega_b = 0.022032
omega_cdm = 0.10
input_verbose = 1
dncdm1.type = ncdm_decay_dr
dncdm1.m = 1.0
dncdm1.T = 0.71611
dncdm1.Gamma = 1e2
dncdm1.Omega_dncdmdr = 0.12
# A decaying parent evolves one momentum grid for background and perturbations.
dncdm1.quadrature_strategy = 3
dncdm1.momenta_bins = 16
# Omega_dncdmdr = 0.12 from a 1 eV parent takes N_eff ~ 11, beyond BBN's helium table; this is
# a closure smoke test, so fix YHe. (It used to reach its target at N_eff ~ 8.7 only because
# the two-grid parent never finished decaying and kept feeding the decay radiation.)
YHe = 0.25
