# Grey-body NCDM example (moments parameterization).
# See test/dotsyntax_greybody.ini for the full field documentation and the
# direct-mode variant. Here the shape is given via moment ratios (r, M2, M3)
# and the mass via the m_M2 = m*M2 convenience.

output = tCl,pCl,mPk
l_max_scalars = 1000
P_k_max_1/Mpc = 1.0
N_ur = 2.0308

gb.type = ncdm_greybody
gb.parameterization = moments
gb.r = 1.5
gb.M2 = 1.0
gb.M3 = 1.0
gb.m_M2 = 0.06

root = test/scenarios/out/ncdm_greybody_
