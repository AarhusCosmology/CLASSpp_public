# Two NCDM species named so construction order != lexical order.
# nu_b is constructed first (lighter mass), nu_a second (heavier),
# but lexical sort puts nu_a first. After ncdm_id removal, iteration
# is by lexical order — this scenario detects accidental order dependence.
h = 0.67556
T_cmb = 2.7255
omega_b = 0.022032
N_ur = 2.0
omega_cdm = 0.12038
YHe = BBN
recombination = RECFAST
output = tCl,pCl,lCl,mPk
modes = s,t
lensing = yes
gauge = synchronous
A_s = 2.215e-9
n_s = 0.9619
l_max_scalars = 2500

nu_b.type = ncdm_standard
nu_b.m = 0.06
nu_b.T = 0.71611
nu_b.deg = 1.0
nu_b.quadrature_strategy = 2
nu_b.momenta_bins = 7
nu_b.max_q = 18.0

nu_a.type = ncdm_standard
nu_a.m = 0.10
nu_a.T = 0.71611
nu_a.deg = 1.0
nu_a.quadrature_strategy = 2
nu_a.momenta_bins = 7
nu_a.max_q = 18.0

root = output/scen_ncdm_multi_unsorted_
write background = yes
