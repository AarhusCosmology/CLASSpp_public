# Two independent scalar fields via dot-syntax (#346): a late axion and an
# exponential quintessence field, each shot to its own Omega, with Lambda
# closing the budget.
output = tCl,pCl,lCl,mPk
lensing = yes
h = 0.67
omega_b = 0.02238
omega_cdm = 0.1201
ax.type = scalar_field
ax.Omega = 0.05
ax.potential = axion
ax.f = 0.5
ax.Theta_initial = 2.0
quint.type = scalar_field
quint.Omega = 0.02
quint.parameters = 10.0, 0.0, 0.0, 0.0
quint.attractor_ic = yes
write background = yes
root = output/dotsyntax_scalar_fields_
